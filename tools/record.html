<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひらがなくん — 録音スタジオ</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1020; --panel:rgba(255,255,255,.055); --edge:rgba(255,255,255,.1);
  --ink:#eceaf6; --sub:#8b87a8; --pink:#ff5f9e; --aqua:#5ce6d5; --ng:#ff6b6b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;padding:20px 18px 60px;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(600px 400px at 20% 0%, rgba(255,95,158,.17), transparent 70%),
             radial-gradient(600px 400px at 85% 25%, rgba(92,230,213,.13), transparent 70%)}
button{font-family:inherit;color:inherit;border:none;cursor:pointer;
       background:var(--panel);border:1px solid var(--edge);border-radius:12px}
button:disabled{opacity:.35;cursor:default}
.en{font-family:Outfit,sans-serif;letter-spacing:.14em}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:19px;font-weight:500;margin-bottom:4px}
h1 small{display:block;font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.3em;color:var(--sub);margin-top:5px}

.setup{border:1px solid var(--edge);border-radius:16px;padding:16px;margin:18px 0;background:rgba(255,255,255,.03);font-size:13px;line-height:1.85;color:var(--sub)}
.setup b{color:var(--ink);font-weight:500}
.setup ol{margin:8px 0 12px 18px}
#pick{padding:12px 18px;font-size:13px;color:var(--aqua);border-color:rgba(92,230,213,.5);background:rgba(92,230,213,.1)}
#pickState{margin-top:10px;font-size:12px;color:var(--aqua)}

.stage{border:1px solid var(--edge);border-radius:20px;padding:24px 20px;text-align:center;
       background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.05), rgba(255,255,255,.012))}
.pos{font-family:Outfit,sans-serif;font-size:11px;letter-spacing:.2em;color:var(--sub)}
.kana{font-size:86px;line-height:1.15;margin:6px 0;text-shadow:0 0 34px rgba(92,230,213,.3)}
.romaji{font-family:Outfit,sans-serif;font-size:15px;letter-spacing:.24em;color:var(--pink);font-weight:700;text-transform:uppercase}
.hint{font-size:12.5px;color:var(--sub);margin-top:12px;line-height:1.7}
.meter{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin:18px auto 6px;max-width:300px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ce6d5,#ff5f9e);transition:width .06s}
.dur{font-family:Outfit,sans-serif;font-size:11px;color:var(--sub);letter-spacing:.12em;min-height:16px}

.controls{display:flex;gap:10px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.controls button{padding:14px 20px;font-size:13px}
#rec{min-width:210px;font-family:Outfit,sans-serif;letter-spacing:.14em;font-weight:700;
     color:#0e1020;background:linear-gradient(120deg,#ff7fb0,#ff5f9e);border-color:transparent;
     box-shadow:0 0 26px rgba(255,95,158,.4)}
#rec.on{background:linear-gradient(120deg,#ff5f5f,#ff3b3b);box-shadow:0 0 34px rgba(255,80,80,.55);
        animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.75}}
.nav{display:flex;gap:10px;justify-content:center;margin-top:10px}
.nav button{padding:10px 16px;font-size:12px;color:var(--sub)}
.msg{text-align:center;font-size:13px;min-height:22px;margin-top:14px;color:var(--aqua)}
.msg.err{color:var(--ng)}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:22px}
.list button{aspect-ratio:1;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--sub)}
.list button em{font-style:normal;font-family:Outfit,sans-serif;font-size:8px;letter-spacing:.1em}
.list button.has{color:var(--aqua);border-color:rgba(92,230,213,.45);background:rgba(92,230,213,.07)}
.list button.cur{border-color:var(--pink);box-shadow:0 0 18px rgba(255,95,158,.35)}
.done{font-family:Outfit,sans-serif;font-size:11px;letter-spacing:.16em;color:var(--sub);margin-top:22px;text-align:center}
.done b{color:var(--aqua)}
</style>
</head>
<body>
<div class="wrap">
  <h1>録音スタジオ<small>HIRAGANA-KUN VOICE</small></h1>

  <div class="setup">
    <b>使い方</b>
    <ol>
      <li>「保存先フォルダを選ぶ」で <b>hiragana-kun/audio/raw</b> を選択</li>
      <li>大きく表示されたかなを1文字ずつ読む（スペースキーでも録音開始/停止）</li>
      <li>録音すると自動で次へ。あとで <code>python3 tools/build_audio.py</code> を実行</li>
    </ol>
    静かな部屋で、口から20cmほど離して、はっきりと。長さは0.5〜1秒で十分です。
    <div><button id="pick">📁 保存先フォルダを選ぶ</button></div>
    <div id="pickState">未選択（このままでも録音できますが、1件ずつダウンロードになります）</div>
  </div>

  <div class="stage">
    <div class="pos" id="pos">1 / 108</div>
    <div class="kana" id="kana">あ</div>
    <div class="romaji" id="romaji">a</div>
    <div class="hint" id="hint"></div>
    <div class="meter"><i id="level"></i></div>
    <div class="dur" id="dur"></div>
    <div class="controls">
      <button id="rec">● 録音する（SPACE）</button>
      <button id="play" disabled>▶ 今録ったのを聞く</button>
      <button id="playCur">🔊 今サイトで鳴る音</button>
    </div>
    <div class="nav">
      <button id="prev">‹ 前</button>
      <button id="skip">次 ›</button>
      <button id="jumpNext">未録音へ跳ぶ</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="done" id="doneCount"></div>
  <div class="list" id="list"></div>
</div>

<script src="../kana-data.js"></script>
<script>
"use strict";
const T = window.KANA_TABLES;
const ITEMS = [];
function push(s){
  if (!s) return;
  const p = s.split('|');
  ITEMS.push({ k:p[0], r:p[1], w:p[2]||'', wr:p[3]||'', we:p[4]||'', note:p[5]||'' });
}
T.seion.forEach(row => row.forEach(push));
T.dakuten.forEach(row => row.forEach(push));
T.small.forEach(push);
T.youon.forEach(row => row.forEach(push));

/* ?set=foreign — katakana-only sounds (ファ, ティ…). Other katakana reuse the hiragana recordings. */
if (new URLSearchParams(location.search).get('set') === 'foreign'){
  ITEMS.length = 0;
  window.KATAKANA_TABLES.foreign.forEach(row => row.forEach(push));
}

/* ?only=ひ,ふ,ほ — re-record just these */
const only = new URLSearchParams(location.search).get('only');
if (only){
  const want = only.split(/[,\s]+/).filter(Boolean);
  const keep = ITEMS.filter(it => want.indexOf(it.k) >= 0);
  if (keep.length) ITEMS.length = 0, ITEMS.push.apply(ITEMS, keep);
}

const keyOf = k => Array.from(k).map(c => c.codePointAt(0).toString(16)).join('-');
const have = {};           // key -> true
let dirHandle = null, idx = 0, rec = null, chunks = [], lastBlob = null, stream = null;
let ext = 'webm', mime = '';

const $ = id => document.getElementById(id);
function msg(t, err){ $('msg').textContent = t || ''; $('msg').className = 'msg' + (err ? ' err' : ''); }

/* ---------- folder ---------- */
$('pick').addEventListener('click', async () => {
  if (!window.showDirectoryPicker){
    msg('このブラウザはフォルダ保存に未対応です。Chrome で開いてください（録音自体はできます）', true);
    return;
  }
  try {
    dirHandle = await window.showDirectoryPicker({ mode:'readwrite' });
    for await (const [name, h] of dirHandle.entries()){
      if (h.kind === 'file'){ const m = name.match(/^([0-9a-f-]+)\./); if (m) have[m[1]] = true; }
    }
    $('pickState').textContent = '保存先: ' + dirHandle.name + '（既存 ' + Object.keys(have).length + ' 件を検出）';
    render();
    msg('保存先を設定しました');
  } catch(e){ /* cancelled */ }
});

/* ---------- recording ---------- */
async function getStream(){
  if (stream) return stream;
  // noiseSuppression must stay off: it eats the breathy [ç] of ひゃ/ひゅ/ひょ
  // and the [ɸ] of ふ, and those kana then sound like きゃ/く.
  stream = await navigator.mediaDevices.getUserMedia({
    audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1 }
  });
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(stream);
  const an = ctx.createAnalyser(); an.fftSize = 512;
  src.connect(an);
  const buf = new Uint8Array(an.frequencyBinCount);
  (function loop(){
    an.getByteTimeDomainData(buf);
    let peak = 0;
    for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128) / 128);
    $('level').style.width = Math.min(100, peak * 165) + '%';
    requestAnimationFrame(loop);
  })();
  for (const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4']){
    if (MediaRecorder.isTypeSupported(m)){ mime = m; ext = m.indexOf('mp4') >= 0 ? 'mp4' : 'webm'; break; }
  }
  return stream;
}
let startedAt = 0;
async function startRec(){
  try { await getStream(); } catch(e){ msg('マイクが使えません: ' + e.message, true); return; }
  chunks = [];
  rec = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined);
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = onStop;
  rec.start();
  startedAt = Date.now();
  $('rec').classList.add('on');
  $('rec').textContent = '■ 止める（SPACE）';
  msg('録音中…');
  clearTimeout(startRec.t);
  startRec.t = setTimeout(() => { if (rec && rec.state === 'recording') rec.stop(); }, 4000);
}
function stopRec(){ if (rec && rec.state === 'recording') rec.stop(); }
async function onStop(){
  $('rec').classList.remove('on');
  $('rec').textContent = '● 録音する（SPACE）';
  const secs = (Date.now() - startedAt) / 1000;
  $('dur').textContent = secs.toFixed(2) + ' s';
  lastBlob = new Blob(chunks, { type: chunks[0] ? chunks[0].type : 'audio/webm' });
  $('play').disabled = false;
  if (secs < 0.25){ msg('短すぎます。もう一度', true); return; }
  await save(lastBlob);
}
async function save(blob){
  const item = ITEMS[idx], name = keyOf(item.k) + '.' + ext;
  if (dirHandle){
    try {
      const fh = await dirHandle.getFileHandle(name, { create:true });
      const w = await fh.createWritable();
      await w.write(blob); await w.close();
      have[keyOf(item.k)] = true;
      msg('保存: ' + name);
      render();
      setTimeout(() => { if (idx < ITEMS.length - 1){ go(idx + 1); } }, 260);
      return;
    } catch(e){ msg('保存できません: ' + e.message, true); return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  have[keyOf(item.k)] = true;
  msg('ダウンロード: ' + name);
  render();
  setTimeout(() => { if (idx < ITEMS.length - 1){ go(idx + 1); } }, 400);
}
$('rec').addEventListener('click', () => (rec && rec.state === 'recording') ? stopRec() : startRec());
$('play').addEventListener('click', () => { if (lastBlob) new Audio(URL.createObjectURL(lastBlob)).play(); });
$('playCur').addEventListener('click', () => {
  const a = new Audio('../audio/' + keyOf(ITEMS[idx].k) + '.m4a?' + Date.now());
  a.play().catch(() => msg('まだ書き出されていません（build_audio.py を実行）', true));
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); (rec && rec.state === 'recording') ? stopRec() : startRec(); }
  if (e.code === 'ArrowRight') go(Math.min(ITEMS.length - 1, idx + 1));
  if (e.code === 'ArrowLeft') go(Math.max(0, idx - 1));
});

/* ---------- navigation ---------- */
function go(i){
  idx = i; lastBlob = null;
  $('play').disabled = true; $('dur').textContent = ''; msg('');
  render();
}
$('prev').addEventListener('click', () => go(Math.max(0, idx - 1)));
$('skip').addEventListener('click', () => go(Math.min(ITEMS.length - 1, idx + 1)));
$('jumpNext').addEventListener('click', () => {
  const n = ITEMS.findIndex(it => !have[keyOf(it.k)]);
  if (n < 0) msg('全部録音できています 🎉'); else go(n);
});

function render(){
  const it = ITEMS[idx];
  $('pos').textContent = (idx + 1) + ' / ' + ITEMS.length;
  $('kana').textContent = it.k;
  $('romaji').textContent = it.r;
  $('hint').innerHTML = it.w
    ? '例: ' + it.w + '（' + it.wr + ' — ' + it.we + '）<br>読むのは <b>' + it.k + '</b> の音だけです'
    : '読むのは <b>' + it.k + '</b> の音だけです';
  const n = ITEMS.filter(x => have[keyOf(x.k)]).length;   // the folder also holds the other set's files
  $('doneCount').innerHTML = '録音済み <b>' + n + '</b> / ' + ITEMS.length;
  $('list').innerHTML = ITEMS.map((x, i) =>
    '<button class="' + (have[keyOf(x.k)] ? 'has ' : '') + (i === idx ? 'cur' : '') + '" data-i="' + i + '">' +
    x.k + '<em>' + x.r + '</em></button>').join('');
}
$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]');
  if (b) go(+b.dataset.i);
});
render();
</script>
</body>
</html>
