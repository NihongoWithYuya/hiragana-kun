<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A — Washi</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f2e9; --paper2:#fffdf8; --sumi:#2b2a28; --sub:#8c857a;
  --rule:#ded5c4; --shu:#c4553c; --ai:#3f6079;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,100,70,.014) 3px 4px),
    repeating-linear-gradient(90deg,transparent 0 3px,rgba(120,100,70,.014) 3px 4px);
  color:var(--sumi);
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  padding-bottom:40px;
}
.mincho{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}

header{padding:26px 22px 14px;display:flex;align-items:flex-end;justify-content:space-between}
h1{font-size:27px;font-weight:600;letter-spacing:.06em;line-height:1.2}
h1 em{display:block;font-style:normal;font-size:10px;letter-spacing:.34em;color:var(--sub);
      font-family:"Hiragino Sans",sans-serif;margin-top:7px}
.count{font-size:12px;color:var(--sub);letter-spacing:.12em;border-bottom:1px solid var(--rule);padding-bottom:3px}

nav{display:flex;gap:26px;padding:0 22px;border-bottom:1px solid var(--rule)}
nav button{padding:12px 2px;font-size:13px;letter-spacing:.18em;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--sumi);border-color:var(--shu)}

section{padding:26px 22px 0}
.sec{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.sec h2{font-size:15px;font-weight:600;letter-spacing:.1em}
.sec span{font-size:10.5px;color:var(--sub);letter-spacing:.14em}
.grid{display:grid;grid-template-columns:repeat(5,1fr);
      border-top:1px solid var(--rule);border-left:1px solid var(--rule);background:var(--paper2)}
.cell{aspect-ratio:1;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.cell .k{font-size:29px;line-height:1}
.cell .r{font-size:9.5px;color:var(--sub);letter-spacing:.14em}
.cell.done{background:#fdf7f2}
.cell.done::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:8px;width:14px;height:2px;background:var(--shu)}
.cell.empty{background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(0,0,0,.02) 5px 6px)}

.card{margin:34px 22px 0;background:var(--paper2);border:1px solid var(--rule);padding:22px}
.cardhead{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.cardhead .kk{font-size:30px;letter-spacing:.04em}
.cardhead .rr{font-size:11px;color:var(--shu);letter-spacing:.24em;margin-top:4px}
.cardhead .nav{display:flex;gap:6px}
.cardhead .nav button{width:34px;height:34px;border:1px solid var(--rule);font-size:13px;color:var(--sub)}
.box{margin:22px auto;width:236px;height:236px;position:relative;border:1px solid var(--rule);background:#fff}
.box svg{width:100%;height:100%;display:block}
.guide{stroke:var(--shu);stroke-width:.6;stroke-dasharray:3 5;opacity:.3;fill:none}
.st{fill:none;stroke:var(--sumi);stroke-width:5.4;stroke-linecap:round;stroke-linejoin:round}
.st.ghost{stroke:rgba(43,42,40,.1)}
.num{font-size:8px;fill:var(--shu);font-family:sans-serif;opacity:0}
.num.on{opacity:.85}
.tools{display:flex;gap:0;border:1px solid var(--rule);margin:0 auto 18px;width:236px}
.tools button{flex:1;padding:11px 0;font-size:12px;letter-spacing:.14em;color:var(--sub);border-right:1px solid var(--rule)}
.tools button:last-child{border-right:none}
.tools button.on{background:var(--sumi);color:var(--paper2)}
.listen{display:block;width:236px;margin:0 auto 20px;padding:12px;border:1px solid var(--sumi);
        font-size:12px;letter-spacing:.2em;text-align:center}
.word{text-align:center;padding-top:18px;border-top:1px solid var(--rule)}
.word .w{font-size:25px;letter-spacing:.06em}
.word .wr{font-size:11px;color:var(--shu);letter-spacing:.2em;margin:6px 0 3px}
.word .we{font-size:12px;color:var(--sub)}
</style></head><body>

<header>
  <h1 class="mincho">ひらがな<em>HIRAGANA</em></h1>
  <div class="count">12 / 46</div>
</header>

<nav><button class="on">CHART</button><button>WRITE</button><button>QUIZ</button></nav>

<section>
  <div class="sec"><h2 class="mincho">清音</h2><span>THE BASIC 46</span></div>
  <div class="grid">
    <div class="cell done"><span class="k">あ</span><span class="r">a</span></div>
    <div class="cell done"><span class="k">い</span><span class="r">i</span></div>
    <div class="cell done"><span class="k">う</span><span class="r">u</span></div>
    <div class="cell"><span class="k">え</span><span class="r">e</span></div>
    <div class="cell"><span class="k">お</span><span class="r">o</span></div>
    <div class="cell done"><span class="k">か</span><span class="r">ka</span></div>
    <div class="cell"><span class="k">き</span><span class="r">ki</span></div>
    <div class="cell"><span class="k">く</span><span class="r">ku</span></div>
    <div class="cell"><span class="k">け</span><span class="r">ke</span></div>
    <div class="cell"><span class="k">こ</span><span class="r">ko</span></div>
    <div class="cell"><span class="k">さ</span><span class="r">sa</span></div>
    <div class="cell"><span class="k">し</span><span class="r">shi</span></div>
    <div class="cell"><span class="k">す</span><span class="r">su</span></div>
    <div class="cell"><span class="k">せ</span><span class="r">se</span></div>
    <div class="cell"><span class="k">そ</span><span class="r">so</span></div>
  </div>
</section>

<div class="card">
  <div class="cardhead">
    <div><div class="kk mincho">あ</div><div class="rr">A</div></div>
    <div class="nav"><button>‹</button><button>›</button><button>✕</button></div>
  </div>
  <div class="box"><svg id="sv" viewBox="0 0 109 109"></svg></div>
  <div class="tools"><button class="on">STROKES</button><button>TRACE</button><button>SLOW</button></div>
  <button class="listen">LISTEN　あ</button>
  <div class="word">
    <div class="w mincho">あめ</div>
    <div class="wr">AME</div>
    <div class="we">rain</div>
  </div>
</div>

<script src="../stroke-data.js"></script>
<script src="mock.js"></script>
</body></html>
